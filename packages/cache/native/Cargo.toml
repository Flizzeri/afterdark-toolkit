[package]
name = "adtk-cache"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# NAPI-RS for Node.js FFI
napi = "3"
napi-derive = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# SQLite
rusqlite = { version = "0.31", features = ["bundled"] }

# Serialization
rmp-serde = "1.1"                                  # MessagePack
serde = { version = "1.0", features = ["derive"] }

# Hashing
blake3 = "1.5"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
