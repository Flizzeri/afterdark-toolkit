name: CI

on:
        pull_request:
                branches: [main]
        push:
                branches: [main]

concurrency:
        group: ${{ github.workflow }}-${{ github.ref }}
        cancel-in-progress: true

jobs:
        lint-and-typecheck:
                name: Lint & Typecheck
                runs-on: ubuntu-latest

                steps:
                        - uses: actions/checkout@v4

                        - uses: pnpm/action-setup@v6
                          with:
                                  version: 10

                        - uses: actions/setup-node@v6
                          with:
                                  node-version: 22
                                  cache: 'pnpm'

                        - name: Install dependencies
                          run: pnpm install --frozen-lockfile

                        - name: Lint
                          run: pnpm run lint

                        - name: Typecheck
                          run: pnpm run check

        test:
                name: Test
                runs-on: ubuntu-latest

                steps:
                        - uses: actions/checkout@v4

                        - uses: pnpm/action-setup@v6
                          with:
                                  version: 10

                        - uses: actions/setup-node@v6
                          with:
                                  node-version: 22
                                  cache: 'pnpm'

                        - name: Install dependencies
                          run: pnpm install --frozen-lockfile

                        - name: Build
                          run: pnpm run build

                        - name: Test
                          run: pnpm run test

        build-rust:
                name: Build Rust (Cache)
                runs-on: ${{ matrix.os }}
                strategy:
                        matrix:
                                os: [ubuntu-latest, macos-latest, windows-latest]

                steps:
                        - uses: actions/checkout@v4

                        - uses: pnpm/action-setup@v6
                          with:
                                  version: 10

                        - uses: actions/setup-node@v6
                          with:
                                  node-version: 22
                                  cache: 'pnpm'

                        - uses: dtolnay/rust-toolchain@stable

                        - uses: Swatinem/rust-cache@v2
                          with:
                                  workspaces: packages/cache

                        - name: Install dependencies
                          run: pnpm install --frozen-lockfile

                        - name: Build cache package
                          working-directory: packages/cache
                          run: pnpm run build

                        - name: Test cache package
                          working-directory: packages/cache
                          run: pnpm run test
